<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 页面背景 */
            background-color: #f0f4f8;
            font-family: "Microsoft Yahei", sans-serif;
            padding: 60px 20px;
        }
        /* 内容盒子，居中 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color:#2563eb;
            margin-bottom:16px;
        }
        p {
            font-size:17px;
            color:#444;
            line-height:1.7;
            margin-bottom:24px;
        }
        hr {
            border: none;
            height:1px;
            background:#ddd;
            margin:30px 0;
        }
        .btn {
            display: inline-block;
            background-color:#2563eb;
            color:white;
            text-decoration: none;
            padding:12px 26px;
            border-radius: 8px;
            transition: 0.2s;
        }
        /* 鼠标悬浮按钮效果 */
        .btn:hover {
            background-color:#1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 你好，网页！</h1>
        <p>这是我写的第一个HTML页面，已经做了美化优化。</p>
        <p>网页实现了居中卡片、柔和阴影、好看配色，手机打开也能正常显示。</p>
        <hr>
        <a class="btn" href="#">点击体验按钮</a>
    </div>
</body>
</html>
