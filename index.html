<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易枪战射击游戏</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body {
            background:#222;
            overflow:hidden;
            cursor: crosshair; /* 十字瞄准光标 */
            font-family: Microsoft Yahei;
        }
        #gameBox{
            width:100vw;
            height:100vh;
            position:relative;
            background:#2c3e50;
        }
        .info{
            position:absolute;
            top:20px;
            left:20px;
            color:white;
            font-size:22px;
            z-index:99;
        }
        .target{
            width:80px;
            height:80px;
            background:#e74c3c;
            border-radius:50%;
            position:absolute;
        }
        #tip{
            position:absolute;
            bottom:30px;
            width:100%;
            text-align:center;
            color:#ccc;
            font-size:16px;
        }
    </style>
</head>
<body>
<div id="gameBox">
    <div class="info">分数：<span id="score">0</span></div>
    <div id="tip">鼠标移动瞄准，点击红色靶子射击！</div>
</div>

<script>
    const gameBox = document.getElementById('gameBox');
    const scoreDom = document.getElementById('score');
    let score = 0;

    // 创建靶子
    function createTarget(){
        const target = document.createElement('div');
        target.className = 'target';
        // 随机位置，防止超出屏幕
        const maxX = window.innerWidth - 100;
        const maxY = window.innerHeight - 150;
        let x = Math.random() * maxX;
        let y = Math.random() * maxY;
        target.style.left = x + 'px';
        target.style.top = y + 'px';

        // 点击靶子加分，靶子消失，出新靶子
        target.addEventListener('click',(e)=>{
            e.stopPropagation();
            score += 10;
            scoreDom.innerText = score;
            target.remove();
            setTimeout(createTarget,300);
        })
        gameBox.appendChild(target);

        // 靶子超时自动消失，刷新
        setTimeout(()=>{
            target.remove();
            createTarget();
        },2200)
    }

    // 空白处点击扣分
    gameBox.addEventListener('click',()=>{
        score = Math.max(0, score - 2);
        scoreDom.innerText = score;
    })

    // 游戏启动，生成第一个靶子
    createTarget();
</script>
</body>
</html>
